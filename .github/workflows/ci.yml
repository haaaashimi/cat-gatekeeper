name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# Restrict permissions for security (2026 security default)
permissions:
  contents: read

# Cancel in-progress runs for the same branch (cost optimization)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Prevent runaway workflows
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false  # Don't cancel other OS builds if one fails
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'  # Built-in caching (2026 best practice)
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Non-blocking security check
      
      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:mac-helper
          npm run verify:mac-helper
          npm run dist:mac
      
      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win
      
      - name: Verify build output
        shell: bash  # Ensure cross-platform compatibility
        run: |
          if [ -d "dist" ] && [ "$(ls -A dist/)" ]; then
            echo "✅ Build successful - artifacts created"
            ls -lh dist/
          else
            echo "❌ Build failed - no artifacts found"
            exit 1
          fi
